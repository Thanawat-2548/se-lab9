<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusLink Prototype</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="phuettiphorn_post_style.css">
</head>
<body>

    <div class="mobile-container">
        
        <div id="screen1">
            <div class="header">
                <div class="logo-area">
                    <div class="logo-circle"><i class="fa-solid fa-graduation-cap" style="font-size: 14px;"></i></div>
                    CampusLink
                </div>
                <div style="text-align: center; font-size: 0.8rem;">
                    Create<br>
                    <button class="create-btn" onclick="switchScreen('screen2')">+</button>
                </div>
            </div>

            <div class="content">
                <input type="text" class="search-bar" placeholder="ค้นหากีฬา หรือสถานที่...">

                <div class="card">
                    <div class="card-image-placeholder"><i class="fa-solid fa-futbol fa-2x"></i></div>
                    <div class="card-lines">
                        <div class="line"></div>
                        <div class="line short"></div>
                    </div>
                    <button class="action-btn">join Team</button>
                </div>

                <div class="card">
                    <div class="card-image-placeholder"><i class="fa-solid fa-basketball fa-2x"></i></div>
                    <div class="card-lines">
                        <div class="line"></div>
                        <div class="line short"></div>
                    </div>
                    <button class="action-btn">join Team</button>
                </div>
            </div>
        </div>

        <div id="screen2" class="hidden">
            <div class="header">
                <div class="logo-area">
                    <div class="logo-circle"><i class="fa-solid fa-graduation-cap" style="font-size: 14px;"></i></div>
                    CampusLink
                </div>
            </div>

            <div class="content">
                <input type="text" class="search-bar" placeholder="หัวข้อโพสต์...">

                <div class="form-group">
                    <label>Location</label>
                    <input type="text" class="input-field" placeholder="ระบุสถานที่">
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" class="input-field">
                    </div>
                    <div class="form-group">
                        <label>Time</label>
                        <input type="time" class="input-field">
                    </div>
                </div>

                <div class="form-group">
                    <label>Required person</label>
                    <div class="stepper">
                        <button class="stepper-btn" onclick="updatePerson(-1)">-</button>
                        <span id="person-count" style="font-size: 1.2rem; font-weight: bold;">1</span>
                        <button class="stepper-btn" onclick="updatePerson(1)">+</button>
                    </div>
                </div>

                <button class="action-btn" style="margin-top: 20px;" onclick="switchScreen('screen1')">Publish Post</button>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-icon active">
                <i class="fa-solid fa-house"></i>
                <span class="nav-label">Home</span>
            </div>
            <div class="nav-icon">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span class="nav-label">Search</span>
            </div>
            <div class="nav-icon">
                <i class="fa-solid fa-bell"></i>
                <span class="nav-label">Alerts</span>
            </div>
            <div class="nav-icon">
                <i class="fa-solid fa-user"></i>
                <span class="nav-label">Profile</span>
            </div>
        </div>

    </div>

    <script src="phuettiphorn_post_script.js"></script>
</body>
</html>
