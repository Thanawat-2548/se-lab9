<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusLink - Desktop Web</title>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- เชื่อมไฟล์ CSS -->
    <link rel="stylesheet" href="phuettiphorn_post_style.css">
</head>
<body>

    <!-- Top Navbar -->
    <nav class="navbar">
        <div class="logo-area">
            <div class="logo-circle"><i class="fa-solid fa-graduation-cap"></i></div>
            CampusLink
        </div>

        <div class="search-bar-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="ค้นหากีฬา หรือสถานที่...">
        </div>

        <div class="nav-actions">
            <button class="icon-btn active" title="Home"><i class="fa-solid fa-house"></i></button>
            <button class="icon-btn" title="Alerts"><i class="fa-solid fa-bell"></i></button>
            <button class="icon-btn" title="Profile"><i class="fa-solid fa-user"></i></button>
            <button class="create-btn" onclick="toggleModal(true)">
                <i class="fa-solid fa-plus"></i> Create Post
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <h2 class="section-title">กิจกรรมที่กำลังจะเกิดขึ้น</h2>
        
        <!-- ส่วนที่ Refactor: ลบ Card ที่ Hardcode ไว้ทั้งหมด และใส่ id="activities-container" ให้ JS มาเติมข้อมูลแทน -->
        <div class="grid-container" id="activities-container">
            <!-- ข้อมูล Card จะถูก Render อัตโนมัติผ่าน JavaScript (phuettiphorn_post_script.js) -->
        </div>
    </main>

    <!-- Create Post Modal -->
    <div class="modal-overlay" id="createModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>สร้างกิจกรรมใหม่</h2>
                <button class="close-btn" onclick="toggleModal(false)"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="form-group">
                <label>หัวข้อโพสต์</label>
                <input type="text" class="input-field" placeholder="เช่น เตะบอล, นัดติวหนังสือ...">
            </div>

            <div class="form-group">
                <label>สถานที่ (Location)</label>
                <input type="text" class="input-field" placeholder="ระบุสถานที่">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>วันที่ (Date)</label>
                    <input type="date" class="input-field">
                </div>
                <div class="form-group">
                    <label>เวลา (Time)</label>
                    <input type="time" class="input-field">
                </div>
            </div>

            <div class="form-group">
                <label>จำนวนคนที่ต้องการ (Required persons)</label>
                <div class="stepper">
                    <button class="stepper-btn" onclick="updatePerson(-1)">-</button>
                    <span id="person-count" style="font-size: 1.2rem; font-weight: 600; width: 30px; text-align: center;">1</span>
                    <button class="stepper-btn" onclick="updatePerson(1)">+</button>
                </div>
            </div>

            <button class="publish-btn" onclick="toggleModal(false)">Publish Post</button>
        </div>
    </div>

    <!-- เชื่อมไฟล์ JavaScript -->
    <script src="phuettiphorn_post_script.js"></script>
</body>
</html>
